name: docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: docs/ is what games.csv renders
        run: python3 bin/build-docs --check
      - name: the extractor archive still parses
        run: python3 -m compileall -q extractor pipeline
