<div class="wrap">
<h1>三粒痴埋示範</h1>
<p class="sub">兩條 PPT2 直播入面，連續三粒方塊互相痴埋、而又出現過三次或以上嘅形。揀右邊一個形，左邊會喺當時真實嘅 board 上面逐粒擺返出嚟。J/L、S/Z 嘅鏡像當同一個形計。</p>
<div class="facts" id="facts"></div>
<div class="bench">
 <section class="panel stack" aria-label="播放">
  <canvas id="board" width="600" height="1200" aria-label="Tetris board"></canvas>
  <div class="steps" id="steps"></div>
  <div class="row"><button id="play">▶ 播放</button><span class="note" id="exn"></span></div>
  <div class="row" id="exs"></div>
  <p class="cap" id="cap"></p>
  <p class="note">數字係擺嘅次序，加框嗰粒係啱啱擺落去嗰粒。board 係第一粒擺之前嘅樣，三粒擺完之前都冇清行（第三粒可能會清）。</p>
 </section>
 <section class="panel" aria-label="形狀">
  <h2>出現過三次或以上嘅形</h2>
  <p class="note" style="margin-bottom:12px">「隨機」係假設第三粒喺所有擺得落嘅位入面隨便揀一個，會砌出呢個形嘅預期次數（頭兩粒照當時實際擺法）。</p>
  <div class="list" id="list"></div>
 </section>

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function unhex(h){const b=[];for(let r=0;r<20;r++){const row=[];for(let c=0;c<10;c++){const i=r*10+c;row.push(!!(parseInt(h[i>>2],16)&(8>>(i&3))));}b.push(row);}return b;}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f>0?255:0,a=Math.abs(f);r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);return `rgb(${r},${g},${b})`;}
function mino(ctx,x,y,w,col,k=.32){const e=Math.max(1.5,w*0.14);ctx.fillStyle=col;ctx.fillRect(x,y,w,w);
  ctx.fillStyle=shade(col,k);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-e,y+e);ctx.lineTo(x+e,y+e);ctx.lineTo(x+e,y+w-e);ctx.lineTo(x,y+w);ctx.closePath();ctx.fill();
  ctx.fillStyle=shade(col,-k);ctx.beginPath();ctx.moveTo(x+w,y+w);ctx.lineTo(x,y+w);ctx.lineTo(x+e,y+w-e);ctx.lineTo(x+w-e,y+w-e);ctx.lineTo(x+w-e,y+e);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();}
// b: rows (0 = bottom), pcs: [{t,c:[[r,c]],n,hi}]
function draw(cv,rows,cols,b,pcs,c0=0,r0=0){
  const ctx=cv.getContext('2d'),W=cv.width/cols,H=cv.height/rows,y=r=>(rows-1-(r-r0))*H,x=c=>(c-c0)*W;
  ctx.fillStyle=css('--well');ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle=css('--grid');ctx.lineWidth=Math.max(1,W/30);
  for(let c=1;c<cols;c++){ctx.beginPath();ctx.moveTo(c*W,0);ctx.lineTo(c*W,cv.height);ctx.stroke();}
  for(let r=1;r<rows;r++){ctx.beginPath();ctx.moveTo(0,r*H);ctx.lineTo(cv.width,r*H);ctx.stroke();}
  const g=Math.max(.5,W*.04);
  if(b)for(let r=r0;r<r0+rows&&r<b.length;r++)for(let c=c0;c<c0+cols;c++)if(b[r][c])mino(ctx,x(c)+g,y(r)+g,W-2*g,css('--G'),.16);
  for(const p of pcs){const col=css('--'+p.t);
    for(const [r,c] of p.c){const X=x(c)+g,Y=y(r)+g,w=W-2*g;mino(ctx,X,Y,w,col);
      ctx.fillStyle='#fff';ctx.font=`700 ${Math.round(w*.5)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.n,X+w/2,Y+w/2+1);
      if(p.hi){ctx.strokeStyle=css('--fg');ctx.lineWidth=Math.max(2,W*.1);const k=ctx.lineWidth/2;ctx.strokeRect(X+k,Y+k,w-2*k,w-2*k);}}}
}
let mi=0,ei=0,st=3,timer=null;
const T=n=>({I:'I',O:'O',T:'T',S:'S',Z:'Z',J:'J',L:'L'})[n];
function fmtT(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function shapeCanvas(m){const cs=m.k.flatMap(([t,c])=>c);const R0=Math.min(...cs.map(x=>x[0])),R1=Math.max(...cs.map(x=>x[0])),C0=Math.min(...cs.map(x=>x[1])),C1=Math.max(...cs.map(x=>x[1]));
  const rows=Math.max(R1-R0+3,6),cols=Math.max(C1-C0+3,6);const cv=document.createElement('canvas');cv.width=cols*24;cv.height=rows*24;
  const r0=R0-Math.floor((rows-(R1-R0+1))/2),c0=C0-Math.floor((cols-(C1-C0+1))/2);
  draw(cv,rows,cols,null,m.k.map(([t,c],j)=>({t,c,n:j+1})),c0,r0);return cv;}
function list(){const L=document.getElementById('list');L.innerHTML='';
  D.motifs.forEach((m,i)=>{const b=document.createElement('button');b.className='shape';b.setAttribute('aria-pressed',i===mi?'true':'false');
    const th=document.createElement('span');th.appendChild(shapeCanvas(m));
    const meta=document.createElement('span');meta.innerHTML=`<span class="n">${m.n} 次 · 隨機 ${m.e}</span><br><span class="w"><span style="white-space:nowrap">${m.k.map(x=>x[0]).join(' → ')}</span>　<span style="white-space:nowrap">凹凸 ${m.db>=0?'+':''}${m.db}</span>　<span style="white-space:nowrap">新窿 ${m.dh}</span></span><br><span class="w">${Object.entries(m.who).map(([k,v])=>k+' '+v).join('、')}</span>`;
    b.append(th,meta);b.onclick=()=>{mi=i;ei=0;st=0;list();show();play(true);};L.appendChild(b);});}
function show(){const m=D.motifs[mi],x=m.ex[ei],b=unhex(x.b);
  draw(document.getElementById('board'),20,10,b,x.ps.slice(0,st).map(([t,c],j)=>({t,c,n:j+1,hi:j===st-1})));
  document.querySelectorAll('#steps button').forEach((e,i)=>e.setAttribute('aria-pressed',i===st?'true':'false'));
  const E=document.getElementById('exs');E.innerHTML='';
  m.ex.forEach((_,i)=>{const e=document.createElement('button');e.textContent='例子 '+(i+1);e.setAttribute('aria-pressed',i===ei?'true':'false');e.onclick=()=>{ei=i;st=0;show();play(true);};E.appendChild(e);});
  document.getElementById('exn').textContent=`${m.ex.length} 個例子`;
  const names=x.ps.map(p=>p[0]);
  document.getElementById('cap').innerHTML=(st===0?'擺之前嘅 board。':`第 ${st} 粒：${names[st-1]}。`)+` ${x.who}，<a href="https://youtu.be/${x.v}?t=${x.t}" target="_blank" rel="noopener">▶ 睇片 ${fmtT(x.t)}</a>`;}
function play(on){clearInterval(timer);timer=null;const B=document.getElementById('play');
  if(on===false||(on===undefined&&timer)){B.textContent='▶ 播放';return;}
